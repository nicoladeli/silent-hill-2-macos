; Opções do Enhanced Edition que o port força a cada execução.
; Se a chave não existir no d3d8.ini gerado pelo EE, ela é criada na seção indicada.

[Display]
; 1 = janela, 2 = tela cheia sem borda (não troca a resolução do Mac), 3 = tela cheia exclusiva (evitar: prende a tela)
ScreenMode = 2

[Module]
; O atualizador automático abre o instalador do EE a cada execução
AutoUpdateModule = 0
